name: Release

# 推送 v* 标签时：为各平台构建可执行文件 -> 统一打包 -> 发布到 GitHub Releases。
# 每个附件都是自包含运行目录：navhub/{可执行文件, frontend/dist, .env.example, scripts/navhub.service}
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            glibc: "2.28"
            os: ubuntu-latest
            binary: navhub
          - artifact: linux-amd64
            target: x86_64-unknown-linux-gnu
            glibc: "2.28"
            os: ubuntu-latest
            binary: navhub
          - artifact: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: navhub.exe
          - artifact: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            binary: navhub
          - artifact: macos-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            binary: navhub

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Zig（Linux 交叉链接，锁定 glibc 下限以兼容 Armbian）
        if: ${{ endsWith(matrix.target, 'linux-gnu') }}
        uses: mlugg/setup-zig@v2

      - name: 安装 cargo-zigbuild
        if: ${{ endsWith(matrix.target, 'linux-gnu') }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v pipx >/dev/null 2>&1; then
            pipx install cargo-zigbuild
          else
            python3 -m pip install --user cargo-zigbuild
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          cargo-zigbuild --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: 编译（release）
        if: ${{ endsWith(matrix.target, 'linux-gnu') }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: 编译（release）
        if: ${{ !endsWith(matrix.target, 'linux-gnu') }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 收集二进制
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "out/navhub-${{ matrix.artifact }}"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  release:
    name: 打包并发布 Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: packages
          merge-multiple: true

      - name: 打包
        run: bash scripts/package.sh

      - name: 生成发布说明
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        with:
          name: NavHub ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
          make_latest: true
